name: Appliquer et tester le portage sans publication
on:
  push:
    branches: [migration/style-mrjam]
    paths: [.github/workflows/appliquer-portage.yml]
permissions:
  contents: write
concurrency:
  group: appliquer-portage-demonstration
  cancel-in-progress: false
jobs:
  preparation:
    if: github.repository == 'MrJ-am/apprendre-a-demontrer' && github.ref == 'refs/heads/migration/style-mrjam'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le transfert avant toute application
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          transfert = ''.join(p.read_text().strip() for p in sorted(Path('.atelier-portage').glob('*.b64')))
          # Corriger deux erreurs de transcription du transport, puis vérifier les octets.
          transfert = transfert.replace('HXzlIfVCII+WHE', 'HXzlIfVCI+WHE').replace('RhLIr3d0f19uTO5', 'RhLIr3d0d19uTO5')
          octets = base64.b64decode(transfert, validate=True)
          empreinte = hashlib.sha256(octets).hexdigest()
          print('Empreinte du transfert :', empreinte)
          assert empreinte == '4db802e602949125b8e02fa11ec9f8f3c7c89c04f657c2b1d90ba9fce6ad7925', 'Le transfert diffère des sources compilées.'
          fichiers = json.loads(gzip.decompress(octets))
          autorises = set('''
          .github/workflows/atelier-style.yml
          .github/workflows/verification.yml
          .gitignore
          elm.json
          package.json
          public/index.html
          public/style.css
          scripts/build.mjs
          scripts/test.mjs
          src/Main.elm
          docs/PORTAGE-ELMUI.md
          scripts/preparer-style.mjs
          style-mrjam.json
          tests/contrats-reference.json
          tests/navigation.py
          tests/requirements.txt
          tests/test_style.py
          '''.split())
          assert set(fichiers) == autorises
          for nom, contenu in fichiers.items():
              chemin = Path(nom)
              assert not chemin.is_absolute() and '..' not in chemin.parts
              chemin.parent.mkdir(parents=True, exist_ok=True)
              chemin.write_text(contenu)
          PY
      - name: Compiler et tester les sources reçues
        run: |
          npm ci
          npm test
          npm run build
          node_modules/.bin/elm-format src tests/Check.elm --validate
      - name: Enregistrer uniquement sur la branche de préparation
        id: sources
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/migration/style-mrjam | cut -f1)" = "$GITHUB_SHA"
          rm -r .atelier-portage
          rm .github/workflows/appliquer-portage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Porter les compositions en ElmUI et vérifier les contrats applicatifs'
          git push origin HEAD:refs/heads/migration/style-mrjam
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Construire l’artefact rattaché au commit effectif
        env:
          GITHUB_SHA: ${{ steps.sources.outputs.revision }}
        run: npm run build
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:interface
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-portage
          include-hidden-files: true
          path: |
            .atelier-portage
            dist
            controles-interface
          retention-days: 3
