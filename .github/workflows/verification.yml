name: Vérifier les parcours
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node_modules/.bin/elm-format src tests/Check.elm --validate
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:interface
      - run: npm run preparer:identite
      - run: npm run test:typographie
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apprendre-a-demontrer-preparation
          path: |
            dist
            controles-interface
            controles-typographie
          retention-days: 7
